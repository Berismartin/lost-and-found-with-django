<body>
    <h2>Conversation on {{ conversation.item.name }}</h2>
    <div>
        {% for msg in messages %}

        <p><b>{{ msg.sender.username }}:</b> {{ msg.content }} <small>{{ msg.created_at }}</small></p>
       {% empty %}
       <p>No messages yet.</p>
       {% endfor %}

  
   </div>

 <form method="POST">
  {% csrf_token %}
  <textarea name="content"></textarea>
  <button type="submit">Send</button>
  <!-- {{ form.as_p }}
  <button type="submit">Send</button> -->
 </form>


    
</body>
</html>
