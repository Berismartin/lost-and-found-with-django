<body>
    <h2>Inbox</h2>
    <ul>
  {% for convo in conversations %}
    <li>
      <a href="{% url 'conversation_detail' convo.id %}">
        Conversation about {{ convo.item.name }}
      </a>
    </li>
  {% empty %}
    <li>No conversations yet.</li>
  {% endfor %}
</ul>
    

    
</body>
</html>
